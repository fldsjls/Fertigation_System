site_name: 双路自动水肥一体化系统文档
site_description: 双路互斥控制、文丘里施肥、部件选型、压力计算与现场调试
docs_dir: docs
site_dir: site
exclude_docs: |
  _generated/

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: teal

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/generated/fertigation-calculator-core.js
  - javascripts/generated/fertigation-calculator.js

nav:
  - 首页: index.md
  - 系统设计:
      - 工程图读图与测点: architecture/diagram-walkthrough.md
      - 系统原理: architecture/system-overview.md
      - 部件选型与数量计算: design/component-sizing.md
      - 压力与肥液计算: design/hydraulic-calculation.md
      - 工程计算工作表: calculations/engineering-calculator.md
  - 安装运行:
      - 安装与清水调试: operations/installation-commissioning.md
      - A → B → A 控制程序: operations/controller-program.md
      - 故障诊断: operations/troubleshooting.md
  - 参考:
      - 接口、牙型与管径清单: reference/interface-schedule.md
      - 资料来源与厂家数据: reference/sources.md
  - ADR:
      - 决策索引: adr/index.md
      - 0001 双路互斥与 B 路串联文丘里: adr/0001-dual-route-inline-venturi.md
